# ==================================================
# APPLICATION
# ==================================================
spring.application.name=payflow-backend
spring.profiles.active=dev

# ==================================================
# SERVER
# ==================================================
server.port=8082
server.error.include-message=always

# ==================================================
# JACKSON
# ==================================================
spring.jackson.default-property-inclusion=non_null

# ==================================================
# DATABASE (MySQL)
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:3306/payflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=8520
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================================================
# HIKARI CONNECTION POOL
# ==================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==================================================
# JPA / HIBERNATE
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==================================================
# SQL INITIALIZATION
# ==================================================
spring.sql.init.mode=always

# ==================================================
# MAIL CONFIGURATION
# ==================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================================================
# REDIS
# ==================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==================================================
# JWT CONFIGURATION
# ==================================================
payflow.jwt.secret=c2VjdXJlLXBheWZsb3ctZGVtby1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
payflow.jwt.access-token-expiration-ms=900000
payflow.jwt.refresh-token-expiration-ms=604800000

# ==================================================
# OTP CONFIGURATION
# ==================================================
payflow.otp.expiry-seconds=300
payflow.otp.length=6

# ==================================================
# TRANSACTION
# ==================================================
payflow.transaction.daily-limit=100000


# ==================================================
# CASHBACK
# ==================================================
payflow.cashback.enabled=true
payflow.cashback.rate=1.0
payflow.cashback.max-per-transaction=100

# ==================================================
# SWAGGER / OPENAPI
# ==================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==================================================
# DEVTOOLS
# ==================================================
spring.devtools.restart.enabled=true

# ==================================================
# LOGGING
# ==================================================
logging.level.com.payflow=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==================================================
# FRAUD
# ==================================================
payflow.fraud.velocity-limit=10
payflow.fraud.velocity-window-minutes=5
payflow.fraud.high-risk-threshold=70
payflow.fraud.medium-risk-threshold=35

# ==================================================
# CASHBACK
# ==================================================
payflow.cashback.rate-percent=1
payflow.cashback.min-amount-for-cashback=100


# ==================================================
# DEV PROFILE (H2)
# ==================================================
spring.config.activate.on-profile=dev
