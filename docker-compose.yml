version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    volumes:
      - payflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: payflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payflow
      DB_USERNAME: payflow
      DB_PASSWORD: payflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: c2VjdXJlLXBheWZsb3ctZGVtby1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: payflow-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  payflow_pg_data:
